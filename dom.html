<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM PROJECT</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="dom-container">

    <p>Youtube Subscribe button</p>

    <button class="js-subscribe-button" onclick="
      subscribeButton()
    ">Subscribe</button>

    <h2>Amazon Shipping Calculator</h2>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders above $40 = FREE shipping.</p>
    
    <input type="text" placeholder="Cost of order" class="js-cost-input"">

    <button onclick="
      calculate()
    ">Calculate</button>

    <p class="output-value"></p>
    
  </div>


  <!-- MY JAVASCRIPT FILE IS LINKED WITH THE HTML FILE HERE -->
  <script src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM extra</title>
</head>
<body>
  <button onclick="
    displayCartQuantity()
    ">Show Quantity</button>

  <button onclick="
  updateCartQuantity(1);
  ">Add to Cart</button>

   <button onclick="
      updateCartQuantity(2);
    ">+2</button>

  <button onclick="
      updateCartQuantity(3);
    ">+3</button>

  <button onclick="
      updateCartQuantity(4);
    ">+4</button>

  <button onclick="
      updateCartQuantity(5);
    ">+5</button>

  <button onclick="
      updateCartQuantity(-1);
    ">Remove fromcart</button>

  <button onclick="
      updateCartQuantity(-2);
    ">-2</button>

  <button onclick="
      updateCartQuantity(-3);
    ">-3</button>
  <p class="cart-quantity"></p>

  <script>
    let cartQuantity = 0;

    // Display the cart quantity when the page loads.
    displayCartQuantity() 
    
    function updateCartQuantity(increase) {
      if (cartQuantity + increase > 10) {
        alert('The cart is full');
        return;
      }

      if (cartQuantity + increase < 0) {
        alert('Not Enough items in the cart');
        return;
      }
        cartQuantity += increase;

        // Display the cart quantity after updating.
        displayCartQuantity();
     
    }

    function displayCartQuantity() {
      document.querySelector('.cart-quantity').innerHTML = `Cart Quantity: ${cartQuantity}`;
    } 

    
  </script>
</body>
</html>

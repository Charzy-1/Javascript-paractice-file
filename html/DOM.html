<!DOCTYPE html>
<html lang="en">
<head>
  <title>DOM</title>
</head>
<body>
  <button>9a</button>
  <button class="second-button">9b</button>

  <button onclick="
    headButton()
    ">heads</button>

  <button onclick="
    tailButton()
    ">tails</button>
  <p class="js-button"></p>

  <input placeholder="Name" class="text-input" onkeydown="
    enterKey(event)
  ">

  <button onclick="
    yourName()
    ">Submit</button>
  <p class="your-name"></p>


  <script>
    function enterKey(event) {
      if (event.key === 'Enter') {
        yourName()
      }
    }

    function yourName() {
     const inputText = document.querySelector('.text-input').value 
     const text = document.querySelector('.your-name').innerHTML = `Your name is: ${inputText}`;
    }

    function headButton() {
      document.querySelector('.js-button').innerHTML = 'You chose: heads';
    }

    function tailButton() {
      document.querySelector('.js-button').innerHTML = 'You chose: tails';
    }

    console.log(document.querySelector('button'));

    document.querySelector('.second-button').innerHTML = '9b done';

  </script>
</body>
</html>

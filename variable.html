<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Javascript practice course</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <h1>Welcome Back to Javascript</h1>

    <p>Cart Quantity</p>

    <button onclick="console.log(`Cart Quantity: ${cart_quantity}`);">
      Show Quantity
    </button>

    <button onclick="console.log(`Cart Quantity: ${cart_quantity = cart_quantity + 1}`);">
      Add to Cart
    </button>

    <button onclick="console.log(`Cart Quantity: ${cart_quantity += 2}`);">
      +2
    </button>

    <button onclick="console.log(`Cart Quantity: ${cart_quantity += 3}`);">
      +3
    </button>

    <button onclick="console.log(`Cart Quantity: ${cart_quantity = 0}`);">
      Reset
    </button>
  </div>


  <!-- MY JAVASCRIPT FILE IS LINKED WITH THE HTML FILE HERE -->
  <script src="index.js"></script>
</body>
</html>
